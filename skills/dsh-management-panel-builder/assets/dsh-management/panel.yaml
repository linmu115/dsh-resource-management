# 方案 A 的 Contract v1 起始模板。
# 复制到目标资源根的 dsh-management/panel.yaml 后，只保留目标资源真实支持的字段和操作。
contractVersion: 1

sections:
  - id: general
    title: 常规
    description: 目标资源最常用的运行设置
    fields:
      - id: feature.enabled
        type: switch
        label: 启用功能
        description: 示例开关；请改成目标资源的真实能力
        default: true
        apply: immediate
        binding:
          kind: profile
          namespace: target-plugin
          key: feature.enabled

      - id: behavior.mode
        type: select
        label: 工作模式
        description: 示例单选；删除不适用的选项
        default: balanced
        options:
          - value: balanced
            label: 平衡
          - value: focused
            label: 专注
        apply: save
        binding:
          kind: plugin-data
          adapterId: target-plugin-runtime
          key: behavior.mode

      - id: render.intensity
        type: slider
        label: 显示强度
        default: 50
        min: 0
        max: 100
        step: 5
        unit: "%"
        apply: restart-required
        binding:
          kind: plugin-data
          adapterId: target-plugin-runtime
          key: render.intensity

  - id: connection
    title: 连接
    description: 只在目标资源确实需要凭据时保留此分组
    fields:
      - id: connection.token
        type: secret
        label: 访问令牌
        placeholder: 输入新值以替换
        apply: save
        binding:
          kind: credential
          key: TARGET_PLUGIN_TOKEN

actions:
  - id: cache.clear
    label: 清理缓存
    description: 示例操作；目标 Plugin 必须登记同名 Host 处理器
    style: danger
    confirmation: 确认清理该插件的可重建缓存？
